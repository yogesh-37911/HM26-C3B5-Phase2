services:
  - type: web
    name: proofforge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_demo.py && gunicorn --worker-class gthread --workers 1 --threads 100 --timeout 120 app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: proofforge-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://proofforge-cyber.onrender.com
      - key: SECURE_ASSESSMENT_REVIEWER_EMAIL
        value: samira.demo@example.invalid
      - key: STUN_URL
        value: stun:stun.l.google.com:19302
      - key: TURN_URL
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: DEMO_CANDIDATE_PASSWORD
        value: DemoPassword123!
      - key: DEMO_REVIEWER_PASSWORD
        value: DemoPassword123!
      - key: DEMO_RECRUITER_PASSWORD
        value: DemoPassword123!

  - type: web
    name: proofforge-cyber
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: VITE_API_BASE_URL
        value: https://proofforge-api.onrender.com
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://proofforge-api.onrender.com wss://proofforge-api.onrender.com https://stun.l.google.com:19302 stun: turn: turns:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: proofforge-db
    plan: free
    databaseName: proofforge
    user: proofforge
    postgresMajorVersion: "16"
